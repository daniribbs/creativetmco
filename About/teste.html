  /* ------------------------------------------------------------------
     Cena
  ------------------------------------------------------------------ */
  const wrap = document.getElementById("globo");
  const canvas = document.getElementById("globo-3d");
  const reduzMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
  
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  } catch (e) {
    console.warn("WebGL indisponível:", e);
  }
  
  if (renderer) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(COR.fundo, 0, 3);
  
    const camera = new THREE.OrthographicCamera(-1.2, 1.2, 1.2, -1.2, 0, 3);
  
    const grupo = new THREE.Group();
    scene.add(grupo);
  
    /* Texturas desenhadas em canvas 2D a partir dos contornos */
    const TW = 4096, TH = 2048, ESC = TW / 2000;
    function criarTextura(desenhar) {
      const c = document.createElement("canvas");
      c.width = TW; c.height = TH;
      const ctx = c.getContext("2d");
      ctx.scale(ESC, ESC);
      ctx.lineJoin = "round";
      desenhar(ctx);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }
  
    const texTerra = criarTextura((ctx) => {
      const p = new Path2D(TERRA);
      ctx.fillStyle = COR.terra;
      ctx.fill(p);
      ctx.strokeStyle = COR.borda;
      ctx.lineWidth = 1;
      ctx.stroke(p);
    });
  
    const texDestaque = criarTextura((ctx) => {
      const p = new Path2D(DESTAQUE);
      ctx.fillStyle = COR.destaque;
      ctx.fill(p);
      ctx.strokeStyle = COR.bordaDest;
      ctx.lineWidth = 1;
      ctx.stroke(p);
    });
  
    /* Oceano (esfera preta) */
    const oceano = new THREE.Mesh(
      new THREE.SphereGeometry(0.998, 64, 64),
      new THREE.MeshBasicMaterial({ color: COR.oceano })
    );
  
    /* Continentes */
    const geo = new THREE.IcosahedronGeometry(1, 20);
    const terra = new THREE.Mesh(
      geo,
      new THREE.MeshBasicMaterial({ map: texTerra, transparent: true })
    );
  
    /* Países destacados: camada ligeiramente elevada */
    const destaque = new THREE.Mesh(
      geo,
      new THREE.MeshBasicMaterial({ map: texDestaque, transparent: true })
    );
    destaque.scale.setScalar(1.014);
  
    oceano.renderOrder = 0;
    terra.renderOrder = 1;
    destaque.renderOrder = 2;
    grupo.add(oceano, terra, destaque);
  
    /* ----------------------------------------------------------------
       Controles
    ---------------------------------------------------------------- */
    const controls = new OrbitControls(camera, canvas);
    canvas.style.touchAction = "pan-y";
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.enableDamping = true;
    controls.minPolarAngle = 0.3 * Math.PI;
    controls.maxPolarAngle = 0.62 * Math.PI;
    controls.autoRotate = !reduzMovimento;
    controls.autoRotateSpeed = 1.1;
  
    // Posição inicial da câmera: de frente para o México (lon -100°, lat 20°)
    const lon0 = THREE.MathUtils.degToRad(-100);
    const lat0 = THREE.MathUtils.degToRad(20);
    camera.position.set(
      -Math.cos(lon0) * Math.cos(lat0),
       Math.sin(lat0),
       Math.sin(lon0) * Math.cos(lat0)
    ).multiplyScalar(1.3);
    controls.update();
  
    // O globo encolhe levemente ao arrastar
    let escalaAlvo = 1;
    controls.addEventListener("start", () => { escalaAlvo = 0.96; });
    controls.addEventListener("end",   () => { escalaAlvo = 1; });
  
    /* ----------------------------------------------------------------
       Tamanho responsivo
    ---------------------------------------------------------------- */
    function ajustarTamanho() {
      const lado = Math.max(1, Math.round(wrap.clientWidth));
      renderer.setSize(lado, lado, false);
    }
    new ResizeObserver(ajustarTamanho).observe(wrap);
    ajustarTamanho();
  
    /* ----------------------------------------------------------------
       Loop de animação (pausa fora da tela / aba oculta)
    ---------------------------------------------------------------- */
    let visivel = true;
    new IntersectionObserver((e) => { visivel = e[0].isIntersecting; }).observe(wrap);
  
    const relogio = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      if (!visivel || document.hidden) return;
  
      const t = relogio.getElapsedTime();
  
      // Os países destacados "respiram" de forma lenta e sutil
      if (!reduzMovimento) {
        destaque.scale.setScalar(1.016 + Math.sin(t * 1.6) * 0.006);
      }
  
      const s = grupo.scale.x + (escalaAlvo - grupo.scale.x) * 0.12;
      grupo.scale.setScalar(s);
  
      controls.update();
      renderer.render(scene, camera);
    });
  }
